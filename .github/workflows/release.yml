name: Release

# Publishes the tool to nuget.org when a vX.Y.Z tag is pushed on main. nuget.org authenticates this
# workflow through Trusted Publishing, so no API key is stored in the repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # exchange the OIDC token for a short-lived nuget.org key

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PROJECT: src/EFDoctor.Cli/EFDoctor.Cli.csproj
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag is not on main. Releases are tagged on main."
            exit 1
          fi
          project_version="$(dotnet msbuild "$PROJECT" -getProperty:Version)"
          if [ "$project_version" != "$version" ]; then
            echo "::error::$tag does not match the project version $project_version."
            exit 1
          fi
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore EFDoctor.sln

      - name: Build
        run: dotnet build EFDoctor.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test EFDoctor.sln --no-build --configuration Release

      - name: Pack
        run: dotnet pack "$PROJECT" --no-build --configuration Release --output artifacts

      - name: Sign in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        # The .snupkg next to the package goes to the symbol server with it.
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg \
            --title "EFDoctor $VERSION" --notes-file release-notes.md --verify-tag $flags
